<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Control</title>
<script src="/socket.io/socket.io.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#151515;color:#fff;padding:14px}
.card{max-width:600px;margin:auto}
.team{background:#242424;border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
input{width:100%;padding:12px;border-radius:8px;border:0;font-size:17px}
button{border:0;border-radius:10px;padding:13px;font-size:17px;font-weight:bold}
.score{font-size:58px;font-weight:bold;text-align:center}
.plus{background:#35c759}
.minus{background:#ff453a;color:#fff}
.main{background:#0a84ff;color:#fff;width:100%;margin:10px 0}
.reset{background:#555;color:#fff;width:100%}
.time{font-size:54px;text-align:center;font-weight:bold;margin:12px 0;font-variant-numeric:tabular-nums}
.status{text-align:center;color:#aaa;margin:8px}
.save{background:#333;color:#fff}
.color{max-width:70px;height:45px;padding:2px}
</style>
</head>
<body>

<div class="card">
<h2>CONTROL TABELĂ</h2>

<div class="team">
<input id="homeName" value="ECHIPA 1">
<div class="row">
<input id="homeColor" class="color" type="color" value="#ffffff">
<button class="minus" onclick="score('home',-1)">−</button>
<div id="homeScore" class="score">0</div>
<button class="plus" onclick="score('home',1)">+</button>
</div>
</div>

<div class="team">
<input id="awayName" value="ECHIPA 2">
<div class="row">
<input id="awayColor" class="color" type="color" value="#ffffff">
<button class="minus" onclick="score('away',-1)">−</button>
<div id="awayScore" class="score">0</div>
<button class="plus" onclick="score('away',1)">+</button>
</div>
</div>

<div id="time" class="time">00:00</div>

<button id="run" class="main" onclick="toggle()">▶ PORNEȘTE</button>

<div class="row">
<button class="save" onclick="setTime(-60)">− 1 MIN</button>
<button class="save" onclick="setTime(60)">+ 1 MIN</button>
</div>

<button class="reset" onclick="resetAll()">RESETARE MECI</button>

<div id="status" class="status">Conectare...</div>
</div>

<script>
const socket=io();

let s={
home:{name:'ECHIPA 1',color:'#fff',score:0},
away:{name:'ECHIPA 2',color:'#fff',score:0},
running:false,
elapsed:0
};

socket.on('state',x=>{
s=x;
render();
});

function render(){
homeName.value=s.home.name;
awayName.value=s.away.name;
homeColor.value=s.home.color;
awayColor.value=s.away.color;
homeScore.textContent=s.home.score;
awayScore.textContent=s.away.score;
time.textContent=fmt(s.elapsed);
run.textContent=s.running?'⏸ OPREȘTE':'▶ PORNEȘTE';
status.textContent='Conectat';
}

function fmt(n){
n=Math.max(0,Math.floor(n));
return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');
}

function score(t,d){
s[t].score=Math.max(0,s[t].score+d);
socket.emit('patch',{[t]:{score:s[t].score}});
}

function toggle(){
socket.emit('patch',{running:!s.running});
}

function setTime(d){
socket.emit('patch',{elapsed:Math.max(0,s.elapsed+d)});
}

function resetAll(){
socket.emit('setState',{
home:{name:homeName.value,color:homeColor.value,score:0},
away:{name:awayName.value,color:awayColor.value,score:0},
running:false,
elapsed:0
});
}

[homeName,awayName,homeColor,awayColor].forEach(e=>
e.addEventListener('change',()=>{
socket.emit('patch',{
home:{name:homeName.value,color:homeColor.value},
away:{name:awayName.value,color:awayColor.value}
});
})
);
</script>

</body>
</html>
